[SERVICE]
    Flush             1
    Daemon            Off
    Log_Level         info
    Parsers_File      parsers.conf
    # Filesystem buffer — ADR-critical: survives network outages
    storage.path      /var/log/flb-storage
    storage.sync      normal
    storage.checksum  On
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020

[INPUT]
    Name              tail
    Tag               gateway.*
    Path              /var/log/gateway/*.log
    Parser            json
    DB                /var/log/flb-storage/tail.db
    storage.type      filesystem
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[OUTPUT]
    Name                  loki
    Match                 gateway.*
    Host                  nginx
    Port                  80
    # Static labels
    Labels                job=fluentbit, env=dev, host=iot-gateway-sim
    # Dynamic labels extracted from log record
    Label_Keys            $service, $level
    Line_Format           json
    # No retry limit — buffer indefinitely while offline (ADR Фаза 1)
    Retry_Limit           no_limits
    storage.total_limit_size 256M
